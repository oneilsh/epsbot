[tool.poetry]
name = "epsbot"
version = "0.1.0"
description = "EPSBot"
authors = ["Shawn T O'Neil <oneilsh@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydantic-ai = ">=0.4.5,<0.5.0"
streamlit = ">=1.47.0,<2.0.0"
python-dotenv = ">=1.1.1,<2.0.0"
tokenizers = "0.21.2"
opaiui = ">=0.14.0"
bibtexparser = "^1.4.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"